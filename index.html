<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitGym - Olá, Vitória!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #fcfcfd; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .active-tab { color: #f43f5e; }
        .tab-content { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="min-h-screen pb-28">

    <!-- Header -->
    <header class="bg-white border-b border-slate-100 p-6 sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Olá, Vitória!</h1>
                <p class="text-[10px] text-rose-500 font-bold uppercase tracking-[0.2em]">VitGym Pro</p>
            </div>
            <div class="bg-rose-50 border border-rose-100 px-4 py-2 rounded-2xl text-right">
                <p class="text-[9px] uppercase font-bold text-rose-400 leading-none">Saldo Atual</p>
                <p class="text-xl font-black text-rose-600 leading-tight" id="balance-display">500</p>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-5 space-y-8">
        
        <!-- ABA FEED (Registros do dia) -->
        <section id="tab-feed" class="tab-content">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-lg font-black text-slate-800">Registros do dia</h2>
                    <p class="text-xs text-slate-400 font-medium italic">Seu histórico de conquistas</p>
                </div>
                <button onclick="openCheckinModal()" class="w-12 h-12 bg-rose-500 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-rose-200">
                    <i class="fas fa-plus text-lg"></i>
                </button>
            </div>
            <div id="feed-list" class="space-y-4">
                <!-- Conteúdo via JS -->
            </div>
        </section>

        <!-- ABA METAS -->
        <section id="tab-metas" class="tab-content hidden">
            <div class="mb-6">
                <h2 class="text-lg font-black text-slate-800 italic uppercase tracking-tighter">📋 Tabela de Metas</h2>
                <p class="text-xs text-slate-500">Realize estas atividades para acumular pontos.</p>
            </div>
            <div id="metas-list" class="space-y-3">
                <!-- Conteúdo via JS -->
            </div>
        </section>

        <!-- ABA LOJA -->
        <section id="tab-shop" class="tab-content hidden">
            <div class="mb-6">
                <h2 class="text-lg font-black text-slate-800 italic uppercase tracking-tighter">🎁 Itens da Lojinha</h2>
                <p class="text-xs text-slate-500">Troque seu saldo por estes prêmios.</p>
            </div>
            <div id="shop-list" class="grid grid-cols-1 gap-3">
                <!-- Conteúdo via JS -->
            </div>
        </section>

        <!-- ABA ADMIN -->
        <section id="tab-admin" class="tab-content hidden">
             <div id="admin-login" class="text-center py-10 space-y-4">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                    <i class="fas fa-lock text-2xl"></i>
                </div>
                <input id="admin-pass" type="password" placeholder="Senha de Acesso" class="w-full p-4 rounded-2xl bg-white border border-slate-200 text-center outline-none focus:border-rose-300 transition-all">
                <button onclick="checkAdmin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">Entrar no Painel</button>
            </div>

            <div id="admin-panel" class="hidden space-y-6">
                <div class="bg-rose-50 p-4 rounded-2xl border border-rose-100 flex justify-between items-center">
                    <span class="text-xs font-bold text-rose-700">MODO EDITOR ATIVO</span>
                    <button onclick="logoutAdmin()" class="text-[10px] bg-white px-3 py-1 rounded-lg shadow-sm font-bold">Sair</button>
                </div>

                <!-- Gestão de Metas -->
                <div class="space-y-4">
                    <h3 class="font-black text-sm uppercase text-slate-400 flex justify-between">
                        Gerenciar Metas
                        <button onclick="openItemModal('meta')" class="text-rose-500">+ Novo</button>
                    </h3>
                    <div id="admin-metas-list" class="space-y-2"></div>
                </div>

                <!-- Gestão de Loja -->
                <div class="space-y-4 pt-4 border-t border-slate-100">
                    <h3 class="font-black text-sm uppercase text-slate-400 flex justify-between">
                        Gerenciar Loja
                        <button onclick="openItemModal('shop')" class="text-rose-500">+ Novo</button>
                    </h3>
                    <div id="admin-shop-list" class="space-y-2"></div>
                </div>

                <div class="pt-10">
                    <button onclick="resetApp()" class="w-full text-red-400 text-[10px] font-bold uppercase tracking-widest underline opacity-50 hover:opacity-100">Resetar Todo o Sistema</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Navegação Inferior -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md glass border border-white/50 p-3 flex justify-around items-center rounded-[2.5rem] shadow-2xl z-50">
        <button onclick="switchTab('feed')" class="nav-btn active-tab flex flex-col items-center" id="nav-feed"><i class="fas fa-bolt text-lg"></i><span class="text-[8px] font-bold uppercase mt-1">Feed</span></button>
        <button onclick="switchTab('metas')" class="nav-btn text-slate-400 flex flex-col items-center" id="nav-metas"><i class="fas fa-list-check text-lg"></i><span class="text-[8px] font-bold uppercase mt-1">Metas</span></button>
        <button onclick="switchTab('shop')" class="nav-btn text-slate-400 flex flex-col items-center" id="nav-shop"><i class="fas fa-gift text-lg"></i><span class="text-[8px] font-bold uppercase mt-1">Loja</span></button>
        <button onclick="switchTab('admin')" class="nav-btn text-slate-400 flex flex-col items-center" id="nav-admin"><i class="fas fa-fingerprint text-lg"></i><span class="text-[8px] font-bold uppercase mt-1">Admin</span></button>
    </nav>

    <!-- MODAL CHECKIN -->
    <div id="modal-checkin" class="fixed inset-0 bg-slate-900/40 hidden z-[60] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 space-y-6 shadow-2xl animate-fadeIn">
            <h3 class="text-xl font-black text-slate-800">Novo Registro</h3>
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Escolha a Atividade</label>
                <select id="checkin-activity" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none font-bold text-slate-700"></select>
            </div>
            <button onclick="submitCheckin()" class="w-full py-5 bg-rose-500 text-white rounded-2xl font-black uppercase tracking-widest shadow-lg shadow-rose-200">Confirmar Ganho</button>
            <button onclick="toggleModal('modal-checkin')" class="w-full text-slate-400 text-xs font-bold uppercase">Fechar</button>
        </div>
    </div>

    <!-- MODAL EDITAR/ADICIONAR ITEM (ADMIN) -->
    <div id="modal-item" class="fixed inset-0 bg-slate-900/40 hidden z-[60] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 space-y-6 shadow-2xl">
            <h3 id="item-modal-title" class="text-xl font-black text-slate-800 uppercase">Adicionar</h3>
            <div class="space-y-4">
                <input type="hidden" id="edit-index">
                <input type="hidden" id="edit-type">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Nome</label>
                    <input id="item-name" type="text" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold">
                </div>
                <div>
                    <label id="item-value-label" class="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Pontos/Preço</label>
                    <input id="item-value" type="number" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold">
                </div>
            </div>
            <button onclick="saveItem()" class="w-full py-5 bg-slate-900 text-white rounded-2xl font-black uppercase tracking-widest">Salvar Alterações</button>
            <button onclick="toggleModal('modal-item')" class="w-full text-slate-400 text-xs font-bold uppercase">Cancelar</button>
        </div>
    </div>

    <script>
        // Configurações iniciais solicitadas
        const DEFAULT_METAS = [
            { nome: "Musculação", pontos: 5 },
            { nome: "Cardio (30 min)", pontos: 5 },
            { nome: "Cardio (20 min)", pontos: 2 },
            { nome: "Beber 2L de Água", pontos: 5 },
            { nome: "Consistência (5 dias seguidos)", pontos: 15 },
            { nome: "Refeição Saudável", pontos: 3 },
            { nome: "Nova Receita Fit", pontos: 10 },
            { nome: "Caminhada (40 min)", pontos: 8 },
            { nome: "Noite de Sono (7h+)", pontos: 5 },
            { nome: "Dormir até às 10:30 (Fim de semana)", pontos: 10 },
            { nome: "Ajudar a mãe", pontos: 5 },
            { nome: "Massagem (15 min)", pontos: 20 },
            { nome: "Cardio (+18)", pontos: 10 },
            { nome: "Tomar Creatina", pontos: 3 },
            { nome: "Comer Frutas", pontos: 3 },
            { nome: "Tratamento H. pylori", pontos: 3000 },
            { nome: "Cirurgia do Joelho", pontos: 3000 }
        ];

        const DEFAULT_LOJA = [
            { nome: "Conjunto Academia (Até R$40)", preco: 700 },
            { nome: "Refeição Livre (iFood)", preco: 850 },
            { nome: "Roupas (Até R$150)", preco: 1050 },
            { nome: "Conjunto Academia (Até R$200)", preco: 1300 },
            { nome: "Jantar Especial", preco: 1600 },
            { nome: "Par de Tênis Novo", preco: 2500 },
            { nome: "Vale R$500 Shein", preco: 3000 },
            { nome: "Perfume Importado", preco: 3400 },
            { nome: "Vale R$1.000 Shein", preco: 6000 }
        ];

        let state = JSON.parse(localStorage.getItem('vitgym_data_v2')) || {
            balance: 500, // Começo com 500
            checkins: [],
            metas: DEFAULT_METAS,
            loja: DEFAULT_LOJA
        };

        function save() { 
            localStorage.setItem('vitgym_data_v2', JSON.stringify(state)); 
            render(); 
        }

        // --- SISTEMA DE ABAS ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab', 'text-slate-400'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('active-tab');
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        // --- SISTEMA ADMIN ---
        function checkAdmin() {
            if(document.getElementById('admin-pass').value === '271224') {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                renderAdmin();
            }
        }
        
        function logoutAdmin() {
            document.getElementById('admin-login').classList.remove('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('admin-pass').value = '';
        }

        // --- OPERAÇÕES ---
        function openCheckinModal() {
            const select = document.getElementById('checkin-activity');
            select.innerHTML = state.metas.map(m => `<option value="${m.nome}">${m.nome} (+${m.pontos} pts)</option>`).join('');
            toggleModal('modal-checkin');
        }

        function submitCheckin() {
            const actName = document.getElementById('checkin-activity').value;
            const meta = state.metas.find(m => m.nome === actName);
            
            // Adição automática
            state.checkins.unshift({ 
                id: Date.now(), 
                activity: actName, 
                points: meta.pontos, 
                date: new Date().toLocaleDateString('pt-BR', {day: '2-digit', month: 'long'}) 
            });
            state.balance += meta.pontos;
            
            toggleModal('modal-checkin');
            save();
        }

        function deleteCheckin(id) {
            const item = state.checkins.find(c => c.id === id);
            state.balance -= item.points;
            state.checkins = state.checkins.filter(c => c.id !== id);
            save();
        }

        // --- GESTÃO ADMIN (ADICIONAR/EDITAR) ---
        function openItemModal(type, index = -1) {
            const isEdit = index > -1;
            document.getElementById('edit-type').value = type;
            document.getElementById('edit-index').value = index;
            document.getElementById('item-modal-title').innerText = isEdit ? 'Editar Item' : 'Novo Item';
            document.getElementById('item-value-label').innerText = type === 'meta' ? 'Pontos' : 'Preço (PTS)';
            
            if(isEdit) {
                const item = type === 'meta' ? state.metas[index] : state.loja[index];
                document.getElementById('item-name').value = item.nome;
                document.getElementById('item-value').value = type === 'meta' ? item.pontos : item.preco;
            } else {
                document.getElementById('item-name').value = '';
                document.getElementById('item-value').value = '';
            }
            
            toggleModal('modal-item');
        }

        function saveItem() {
            const type = document.getElementById('edit-type').value;
            const index = parseInt(document.getElementById('edit-index').value);
            const name = document.getElementById('item-name').value;
            const value = parseInt(document.getElementById('item-value').value);

            if(!name || !value) return;

            if(type === 'meta') {
                const metaObj = { nome: name, pontos: value };
                if(index > -1) state.metas[index] = metaObj;
                else state.metas.push(metaObj);
            } else {
                const shopObj = { nome: name, preco: value };
                if(index > -1) state.loja[index] = shopObj;
                else state.loja.push(shopObj);
            }

            toggleModal('modal-item');
            save();
            renderAdmin();
        }

        function deleteItem(type, index) {
            if(type === 'meta') state.metas.splice(index, 1);
            else state.loja.splice(index, 1);
            save();
            renderAdmin();
        }

        // --- RENDERIZAÇÃO ---
        function render() {
            document.getElementById('balance-display').innerText = state.balance;
            
            // Feed
            const feed = document.getElementById('feed-list');
            if(state.checkins.length === 0) {
                feed.innerHTML = `<div class="py-10 text-center text-slate-300 text-sm font-medium">Nenhum registro hoje...<br>Clique no + para começar!</div>`;
            } else {
                feed.innerHTML = state.checkins.map(c => `
                    <div class="bg-white p-5 rounded-[2rem] card-shadow relative border border-slate-50">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-rose-50 rounded-full flex items-center justify-center text-rose-500">
                                <i class="fas fa-check"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 leading-tight">${c.activity}</h3>
                                <p class="text-[9px] font-black text-rose-400 uppercase tracking-widest">${c.date} • +${c.points} PTS</p>
                            </div>
                        </div>
                        <button onclick="deleteCheckin(${c.id})" class="absolute top-6 right-6 text-slate-200 hover:text-red-400 transition-colors"><i class="fas fa-times"></i></button>
                    </div>
                `).join('');
            }

            // Metas
            document.getElementById('metas-list').innerHTML = state.metas.map(m => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center card-shadow border-l-4 border-rose-400">
                    <span class="font-bold text-xs text-slate-700">${m.nome}</span>
                    <span class="bg-rose-50 text-rose-600 font-black text-[10px] px-3 py-1 rounded-full">+${m.pontos} PTS</span>
                </div>
            `).join('');

            // Loja
            document.getElementById('shop-list').innerHTML = state.loja.map(i => {
                const canBuy = state.balance >= i.preco;
                return `
                <div class="bg-white p-5 rounded-[2rem] border border-slate-100 card-shadow flex justify-between items-center ${!canBuy ? 'opacity-60' : ''}">
                    <div class="flex-1">
                        <h4 class="text-xs font-black text-slate-800 uppercase tracking-tight">${i.nome}</h4>
                        <p class="text-rose-600 font-extrabold text-[10px] mt-1 italic">${i.preco} PONTOS</p>
                    </div>
                    <button class="${canBuy ? 'bg-slate-900 shadow-lg' : 'bg-slate-200 cursor-not-allowed'} text-white text-[10px] font-black px-4 py-2 rounded-xl uppercase">
                        ${canBuy ? 'Resgatar' : 'Bloqueado'}
                    </button>
                </div>
            `}).join('');
        }

        function renderAdmin() {
            document.getElementById('admin-metas-list').innerHTML = state.metas.map((m, idx) => `
                <div class="bg-white p-3 rounded-xl flex justify-between items-center border border-slate-100">
                    <span class="text-xs font-bold">${m.nome} (${m.pontos})</span>
                    <div class="flex gap-2">
                        <button onclick="openItemModal('meta', ${idx})" class="text-blue-500 text-xs"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteItem('meta', ${idx})" class="text-red-400 text-xs"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            document.getElementById('admin-shop-list').innerHTML = state.loja.map((i, idx) => `
                <div class="bg-white p-3 rounded-xl flex justify-between items-center border border-slate-100">
                    <span class="text-xs font-bold">${i.nome} (${i.preco})</span>
                    <div class="flex gap-2">
                        <button onclick="openItemModal('shop', ${idx})" class="text-blue-500 text-xs"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteItem('shop', ${idx})" class="text-red-400 text-xs"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function resetApp() { 
            if(confirm('Isso vai apagar TUDO (pontos, metas customizadas e histórico). Confirmar?')) {
                localStorage.clear(); 
                location.reload(); 
            }
        }

        // Iniciar
        render();
    </script>
</body>
</html>
